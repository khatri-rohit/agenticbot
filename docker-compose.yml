# Agenticbot local infrastructure: Redis (BullMQ) + Speaches (STT only).
#
# This stack does NOT run Ollama and never mounts Ollama model directories.
# Chat uses cloud Ollama via host apps/api .env (OLLAMA_BASE_URL=https://ollama.com/v1).
# Your existing local Ollama container / D:\ollama\models (or any host path) is untouched
# by `up` / `down` / `down -v` for this project.
#
# Portable defaults use Docker named volumes (macOS / Linux / Windows).
# Machine-specific binds go in gitignored .env.docker — see docker/README.md.
#
# Quick start:
#   docker compose --profile cpu up -d

name: agenticbot

services:
  redis:
    image: redis:7-alpine
    container_name: agenticbot-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-127.0.0.1:6379}:6379'
    volumes:
      # Bare name = named volume; absolute/host path = bind mount (set in .env.docker)
      - ${REDIS_DATA_DIR:-redis-data}:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agenticbot

  speaches:
    profiles: ['cpu']
    image: ghcr.io/speaches-ai/speaches:${SPEACHES_TAG:-latest-cpu}
    container_name: agenticbot-speaches
    restart: unless-stopped
    ports:
      - '${SPEACHES_HOST_PORT:-127.0.0.1:8000}:8000'
    environment:
      LOG_LEVEL: ${SPEACHES_LOG_LEVEL:-info}
      ENABLE_UI: ${SPEACHES_ENABLE_UI:-false}
      STT_MODEL_TTL: ${SPEACHES_STT_MODEL_TTL:--1}
      PRELOAD_MODELS: ${SPEACHES_PRELOAD_MODELS:-["Systran/faster-distil-whisper-large-v3"]}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: ${SPEACHES_WHISPER_COMPUTE_TYPE:-int8_float32}
    volumes:
      # Speech models only — never Ollama paths
      - ${SPEACHES_HF_CACHE_DIR:-speaches-hf-cache}:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agenticbot

  speaches-gpu:
    profiles: ['gpu']
    image: ghcr.io/speaches-ai/speaches:${SPEACHES_TAG:-latest-cuda}
    container_name: agenticbot-speaches
    restart: unless-stopped
    ports:
      - '${SPEACHES_HOST_PORT:-127.0.0.1:8000}:8000'
    environment:
      LOG_LEVEL: ${SPEACHES_LOG_LEVEL:-info}
      ENABLE_UI: ${SPEACHES_ENABLE_UI:-false}
      STT_MODEL_TTL: ${SPEACHES_STT_MODEL_TTL:--1}
      PRELOAD_MODELS: ${SPEACHES_PRELOAD_MODELS:-["Systran/faster-distil-whisper-large-v3"]}
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: ${SPEACHES_WHISPER_COMPUTE_TYPE:-float16}
    volumes:
      - ${SPEACHES_HF_CACHE_DIR:-speaches-hf-cache}:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agenticbot

networks:
  agenticbot:
    name: agenticbot

volumes:
  redis-data:
  speaches-hf-cache:
